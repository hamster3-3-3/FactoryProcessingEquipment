name: 更新 Excel 資料並發布網站

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: halfproduct-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 安裝 Excel 讀取套件
        run: python -m pip install -r requirements.txt
      - name: 由四廠 Excel 產生網站資料
        run: python scripts/import_data.py data --output data-json
      - name: 檢查資料與篩選功能
        run: |
          node scripts/verify.cjs
          node --check app.js
          node --check filters.js
          node --check data-json/data.js
      - name: 記錄轉換後的資料
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-json/data.json data-json/data.js
          if ! git diff --cached --quiet; then
            git commit -m 'data: update dashboard JSON'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - name: 整理網站檔案
        run: python scripts/package_site.py
      - name: 上傳網站發布檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
